<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Agarwal Foods - Authentic Indian Chutneys & Spices">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agarwal Foods">
  <link rel="apple-touch-icon" href="icons/agarwal_foods_png.png">

  <!-- Favicons and Preloads -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/agarwal_foods_png.png">
  <link rel="icon" type="image/png" href="icons/agarwal_foods_png.png">
  <link rel="shortcut icon" type="image/png" href="icons/agarwal_foods_png.png">
  <link rel="preload" href="icons/agarwal_foods_png.png" as="image">

  <title>Agarwal Foods - Authentic Indian Chutneys</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Splash Screen & Loader Styles */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FAF8F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #FFFFFF 0%, #FAF8F5 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999999;
      user-select: none;
      -webkit-user-select: none;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: splashAppear 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .splash-logo-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-logo {
      width: 190px;
      max-width: 60vw;
      height: auto;
      object-fit: contain;
      border-radius: 18px;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.07));
      animation: splashPulse 2.2s ease-in-out infinite alternate;
    }

    .splash-progress-track {
      width: 150px;
      height: 4px;
      background: rgba(255, 75, 0, 0.12);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 26px;
      position: relative;
    }

    .splash-progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #FF4B00, #FF8A00);
      border-radius: 99px;
      animation: splashProgress 1.4s ease-in-out infinite;
    }

    .splash-tagline {
      margin-top: 14px;
      font-size: 13px;
      font-weight: 600;
      color: #7D6B60;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    @keyframes splashAppear {
      0% {
        opacity: 0;
        transform: scale(0.9) translateY(10px);
      }

      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes splashPulse {
      0% {
        transform: scale(1);
      }

      100% {
        transform: scale(1.03);
      }
    }

    @keyframes splashProgress {
      0% {
        left: -45%;
      }

      50% {
        width: 55%;
      }

      100% {
        left: 100%;
        width: 45%;
      }
    }
  </style>
</head>

<body>
  <!-- Agarwal Foods Splash Screen while opening website -->
  <div id="splash-screen">
    <div class="splash-content">
      <div class="splash-logo-wrapper">
        <img class="splash-logo" src="icons/agarwal_foods_png.png" alt="Agarwal Foods Logo">
      </div>
      <div class="splash-progress-track">
        <div class="splash-progress-bar"></div>
      </div>
      <div class="splash-tagline">Authentic Indian Flavors</div>
    </div>
  </div>

  <script>
    function removeSplashScreen() {
      const splash = document.getElementById('splash-screen');
      if (splash && !splash.classList.contains('fade-out')) {
        splash.classList.add('fade-out');
        setTimeout(function () {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 250);
      }
    }

    // 1. Primary: Native Flutter Web first-frame event
    window.addEventListener('flutter-first-frame', function () {
      removeSplashScreen();
    });

    // 2. DOM Observer: Fallback when Flutter view is mounted
    const splashObserver = new MutationObserver(function (mutations, observer) {
      for (let i = 0; i < mutations.length; i++) {
        const addedNodes = mutations[i].addedNodes;
        for (let j = 0; j < addedNodes.length; j++) {
          const node = addedNodes[j];
          if (node.nodeType === 1) {
            const tag = node.tagName.toLowerCase();
            if (tag === 'flutter-view' || tag === 'flt-glass-pane') {
              setTimeout(removeSplashScreen, 150);
              observer.disconnect();
              return;
            }
          }
        }
      }
    });

    splashObserver.observe(document.body, { childList: true, subtree: true });

    // 3. Timed safety fallback (in case events are delayed or already triggered)
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
          removeSplashScreen();
        }
      }, 2000);
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
